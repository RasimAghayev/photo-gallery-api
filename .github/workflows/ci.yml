name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENV_FILE: var/.env
  COMPOSE: docker compose --env-file var/.env

jobs:
  static-checks:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare local environment file
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Validate compose configuration
        run: docker compose --env-file var/.env config --quiet

      - name: Build test image
        run: docker compose --env-file var/.env build test

      - name: Run Pint lint check
        run: docker compose --env-file var/.env --profile test run --rm --entrypoint ./vendor/bin/pint test --test

      - name: Run Larastan static analysis
        run: docker compose --env-file var/.env --profile test run --rm --entrypoint ./vendor/bin/phpstan test analyse --memory-limit=512M

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare local environment file
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Build test image
        run: docker compose --env-file var/.env build test

      - name: Run composer audit
        run: docker compose --env-file var/.env --profile test run --rm --entrypoint composer test audit --no-interaction --abandoned=report

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static-checks, dependency-audit, secret-scan]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare local environment file
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Build test image
        run: docker compose --env-file var/.env build test

      - name: Run PHPUnit tests
        run: docker compose --env-file var/.env --profile test run --rm test

  build-and-scan:
    name: Build and image security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare local environment file
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Build application image
        run: docker compose --env-file var/.env build app

      - name: Build database image
        run: docker compose --env-file var/.env build mysql

      - name: Scan application image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: photo-gallery-api-app:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Validate compose config
        run: docker compose --env-file var/.env config --quiet
