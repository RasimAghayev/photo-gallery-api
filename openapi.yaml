openapi: 3.0.3
info:
  title: photo-gallery-api
  description: >
    An image gallery API with a scheduled cleanup. Every response is JSON.
    This file is a machine-readable mirror of docs/api.md — that file stays
    the source of truth for prose explanation; this one is for tooling
    (Postman, codegen, contract tests).
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Local development (docker compose)

tags:
  - name: image
  - name: health

paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: The process is up and can serve a request. No dependency check.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: The process is up and its database connection answers.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready — the database connection failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/image:
    get:
      tags: [image]
      summary: List images, ten at a time
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: A page of images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
    post:
      tags: [image]
      summary: Create an image
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageWriteRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/image/{id}:
    get:
      tags: [image]
      summary: Show one image, with a temporary signed file URL
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [image]
      summary: Update an image
      security:
        - sanctum: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpdateRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [image]
      summary: Delete an image and its file
      security:
        - sanctum: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/image/{id}/file:
    get:
      tags: [image]
      summary: The file itself, through a signed URL
      description: >
        The URL is only valid when it carries a valid signature and has not
        expired (5 minutes). Obtain it from GET /api/v1/image/{id}.
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream: {}
        "403":
          description: Missing or expired signature.
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Issued via `php artisan api:token <email>`.

  parameters:
    ImageId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: Missing or invalid Sanctum token.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthenticated.
    NotFound:
      description: No record with that id.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Image not found.
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string

    Image:
      type: object
      properties:
        name:
          type: string
          example: A photo of a cat
        type:
          type: integer
          enum: [1, 2, 3]
        description:
          type: string
          example: A cat that sits on a table.

    ImageDetail:
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          properties:
            url:
              type: string
              format: uri
              example: http://localhost:8080/api/v1/image/1/file?expires=1758444000&signature=...
            expires_in:
              type: integer
              example: 300

    ImageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Image"

    ImageDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ImageDetail"

    ImageListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            from:
              type: integer
            to:
              type: integer
            total:
              type: integer

    ImageWriteRequest:
      type: object
      required: [imageName, imageDescription, imageType, imageFile]
      properties:
        imageName:
          type: string
          minLength: 3
          maxLength: 50
        imageDescription:
          type: string
          minLength: 3
          maxLength: 250
        imageType:
          type: integer
          enum: [1, 2, 3]
        imageFile:
          type: string
          format: binary
          description: jpeg, jpg, png or gif, at most 5MB.

    ImageUpdateRequest:
      type: object
      required: [imageName, imageDescription, imageType]
      properties:
        imageName:
          type: string
          minLength: 3
          maxLength: 50
        imageDescription:
          type: string
          minLength: 3
          maxLength: 250
        imageType:
          type: integer
          enum: [1, 2, 3]
        imageFile:
          type: string
          format: binary
          description: Optional. A record without a new file keeps the one it has.
